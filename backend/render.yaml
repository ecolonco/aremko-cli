services:
  - type: web
    name: aremko-cli-backend
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 8080
      - key: BOOKING_SYSTEM_URL
        value: https://www.aremko.cl
      - key: ENABLE_BOOKINGS
        value: true
      - key: ENABLE_META_ADS
        value: true
      - key: ENABLE_GOOGLE_ADS
        value: false
      - key: ENABLE_LINKEDIN
        value: false
      - key: META_ACCESS_TOKEN
        sync: false
      - key: META_AD_ACCOUNT_ID
        sync: false
      # Key para los proxies hacia Django que usan AUTOMATION_API_KEY
      # (publicaciones planificadas del asistente community manager).
      # Mismo valor que la env var AUTOMATION_API_KEY del Django en Render.
      - key: AUTOMATION_API_KEY
        sync: false
    healthCheckPath: /health
